name: Build and release DouNi Calendar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.0
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: douni-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-\.][A-Za-z0-9.-]+)?$ ]]; then
            echo "Expected a version tag such as v1.0.0" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false
      - name: Build Windows app
        shell: pwsh
        run: ./tools/build.ps1
      - name: Test Windows date, storage and UI logic
        shell: pwsh
        run: ./tools/test.ps1
      - name: Package Windows app
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: ./tools/package-windows.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: release/DouNiCalendar-*-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  macos:
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false
      - name: Build Universal macOS app
        shell: bash
        env:
          DOUNI_VERSION: ${{ needs.metadata.outputs.version }}
        run: bash src/macos/build.sh "$PWD/dist/DouNi-Calendar-macOS"
      - name: Verify Universal executable and local signature
        shell: bash
        run: |
          set -euo pipefail
          lipo -verify_arch arm64 x86_64 "dist/DouNi-Calendar-macOS/DouNi Calendar.app/Contents/MacOS/DouNiCalendar"
          codesign --verify --deep --strict "dist/DouNi-Calendar-macOS/DouNi Calendar.app"
      - name: Test macOS date and storage logic
        shell: bash
        run: '"dist/DouNi-Calendar-macOS/DouNi Calendar.app/Contents/MacOS/DouNiCalendar" --self-test'
      - name: Package macOS app
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp docs/使用说明-macOS.txt dist/DouNi-Calendar-macOS/使用说明.txt
          # The build output contains only the app; no personal data is copied.
          ditto -c -k --sequesterRsrc --keepParent dist/DouNi-Calendar-macOS "release/DouNiCalendar-${RELEASE_VERSION}-macOS-universal.zip"
          unzip -Z1 "release/DouNiCalendar-${RELEASE_VERSION}-macOS-universal.zip" | grep -q 'DouNi Calendar.app/Contents/MacOS/DouNiCalendar'
          if unzip -Z1 "release/DouNiCalendar-${RELEASE_VERSION}-macOS-universal.zip" | grep -Eq '(^|/)(data|notes|backup)/|settings\.ini$'; then
            echo "Personal data must not be present in a release archive" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: release/DouNiCalendar-*-macOS-universal.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    needs: [metadata, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          merge-multiple: true
          path: release
      - name: Publish one package for each platform
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          windows="release/DouNiCalendar-${RELEASE_VERSION}-Windows-x64.zip"
          macos="release/DouNiCalendar-${RELEASE_VERSION}-macOS-universal.zip"
          test -f "$windows" && test -f "$macos"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "豆泥日历 ${RELEASE_VERSION}" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "$windows" "$macos" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
